name: Release
on:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s tests -v
      - name: Compile all Switchyard modules
        run: >-
          python -c "from pathlib import Path; import py_compile; files=sorted(Path('.').glob('switchyard_*.py'))+[Path('switchyard_desktop.pyw')]; [py_compile.compile(str(p), doraise=True) for p in files]; print(f'compiled {len(files)} modules')"
      - shell: powershell
        run: .\build-windows.ps1
      - shell: powershell
        run: '$h=(Get-FileHash dist\Switchyard.exe -Algorithm SHA256).Hash.ToLower(); "$h  Switchyard.exe" | Out-File -Encoding ascii dist\Switchyard.exe.sha256'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Switchyard.exe
            dist/Switchyard.exe.sha256
