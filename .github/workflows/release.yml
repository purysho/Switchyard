name: Release
on:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s tests -v
      - shell: powershell
        run: .\build-windows.ps1
      - shell: powershell
        run: '$h=(Get-FileHash dist\Switchyard.exe -Algorithm SHA256).Hash.ToLower(); "$h  Switchyard.exe" | Out-File -Encoding ascii dist\Switchyard.exe.sha256'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Switchyard.exe
            dist/Switchyard.exe.sha256
