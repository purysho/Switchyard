# Code signing is optional and switches on by itself once these repository
# secrets exist (Settings -> Secrets and variables -> Actions):
#   Windows (Azure Artifact Signing): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#     AZURE_CERT_PROFILE
#   macOS (Developer ID + notarization): APPLE_CERT_P12, APPLE_CERT_PASSWORD,
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Without them, builds are published unsigned, as before.

name: Release
on:
  push:
    tags: ['v*']
    branches: ['release-v*']
permissions: { contents: write }
jobs:
  unix:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
          - os: ubuntu-22.04
            platform: Linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/release-v') && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build and smoke-test package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller pillow
          python tools/make_icon.py
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m PyInstaller --noconfirm --clean --windowed --name Switchyard --icon assets/icon.ico switchyard_desktop.pyw
            dist/Switchyard.app/Contents/MacOS/Switchyard --smoke-test
            .github/scripts/sign-macos.sh dist/Switchyard.app
            ditto -c -k --keepParent dist/Switchyard.app "out/Switchyard-${{ matrix.platform }}.zip"
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name Switchyard switchyard_desktop.pyw
            dist/Switchyard --smoke-test
            tar -C dist -czf "out/Switchyard-${{ matrix.platform }}.tar.gz" Switchyard
          fi
          cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Switchyard-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
  release:
    needs: unix
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/release-v') && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.ref_type }}" -eq "branch") {
            $tag = "${{ github.ref_name }}".Substring("release-".Length)
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"
      - run: python -m unittest discover -s tests -v
      - name: V1 first-run smoke test
        run: python tools/v1_smoke.py
      - name: Compile all Switchyard modules
        run: >-
          python -c "from pathlib import Path; import py_compile; files=sorted(Path('.').glob('switchyard_*.py'))+[Path('switchyard_desktop.pyw')]; [py_compile.compile(str(p), doraise=True) for p in files]; print(f'compiled {len(files)} modules')"
      - shell: powershell
        run: .\build-windows.ps1
      - name: Sign Windows executable
        # Runs only once the Artifact Signing secrets exist; see the header of this file.
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Smoke-test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\Switchyard.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Generate release checksum
        shell: powershell
        run: |
          $h = (Get-FileHash dist\Switchyard.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Switchyard.exe" | Out-File -Encoding ascii dist\Switchyard.exe.sha256
          Write-Host "Switchyard.exe SHA256 $h"
      - name: Download macOS and Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: Switchyard-*
          path: unix
          merge-multiple: true
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $unixAssets = @(Get-ChildItem unix -File | ForEach-Object { $_.FullName })
          if ($unixAssets.Count -ne 4) { throw "Expected 4 macOS/Linux release files, found $($unixAssets.Count)" }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck

          if ($response.StatusCode -eq 200) {
            Write-Host "Release $tag already exists; replacing assets."
            gh release upload "$tag" dist\Switchyard.exe dist\Switchyard.exe.sha256 @unixAssets --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } elseif ($response.StatusCode -eq 404) {
            Write-Host "Release $tag does not exist; creating it."
            gh release create "$tag" dist\Switchyard.exe dist\Switchyard.exe.sha256 @unixAssets --repo "${{ github.repository }}" --target main --title "Switchyard $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          } else {
            throw "Unexpected GitHub API response while checking release ${tag}: HTTP $($response.StatusCode)"
          }
