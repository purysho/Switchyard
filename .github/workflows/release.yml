name: Release
on:
  push:
    tags: ['v*']
    branches: ['release-v*']
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/release-v') && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Resolve release tag
        shell: powershell
        run: |
          if ("${{ github.ref_type }}" -eq "branch") {
            $tag = "${{ github.ref_name }}".Substring("release-".Length)
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"
      - run: python -m unittest discover -s tests -v
      - name: V1 first-run smoke test
        run: python tools/v1_smoke.py
      - name: Compile all Switchyard modules
        run: >-
          python -c "from pathlib import Path; import py_compile; files=sorted(Path('.').glob('switchyard_*.py'))+[Path('switchyard_desktop.pyw')]; [py_compile.compile(str(p), doraise=True) for p in files]; print(f'compiled {len(files)} modules')"
      - shell: powershell
        run: .\build-windows.ps1
      - name: Smoke-test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\Switchyard.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Generate release checksum
        shell: powershell
        run: |
          $h = (Get-FileHash dist\Switchyard.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Switchyard.exe" | Out-File -Encoding ascii dist\Switchyard.exe.sha256
          Write-Host "Switchyard.exe SHA256 $h"
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck

          if ($response.StatusCode -eq 200) {
            Write-Host "Release $tag already exists; replacing assets."
            gh release upload "$tag" dist\Switchyard.exe dist\Switchyard.exe.sha256 --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          } elseif ($response.StatusCode -eq 404) {
            Write-Host "Release $tag does not exist; creating it."
            gh release create "$tag" dist\Switchyard.exe dist\Switchyard.exe.sha256 --repo "${{ github.repository }}" --target main --title "Switchyard $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          } else {
            throw "Unexpected GitHub API response while checking release ${tag}: HTTP $($response.StatusCode)"
          }
