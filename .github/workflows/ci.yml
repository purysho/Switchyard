name: CI
on: [push, pull_request]
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest], python: ['3.10','3.12'] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s tests -v
      - name: V1 first-run smoke test
        run: python tools/v1_smoke.py
      - name: Compile all Switchyard modules
        run: >-
          python -c "from pathlib import Path; import py_compile; files=sorted(Path('.').glob('switchyard_*.py'))+[Path('switchyard_desktop.pyw')]; [py_compile.compile(str(p), doraise=True) for p in files]; print(f'compiled {len(files)} modules')"
  release-soak:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Repeat full test suite three times
        run: >-
          python -c "import subprocess,sys; [subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-v'], check=True) for _ in range(3)]"
      - name: Repeat first-run smoke five times
        run: >-
          python -c "import subprocess,sys; [subprocess.run([sys.executable,'tools/v1_smoke.py'], check=True) for _ in range(5)]"
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: powershell
        run: .\build-windows.ps1
      - name: Smoke-test packaged executable
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\Switchyard.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Generate candidate checksum
        shell: powershell
        run: |
          $h = (Get-FileHash .\dist\Switchyard.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Switchyard.exe" | Out-File -Encoding ascii .\dist\Switchyard.exe.sha256
          Write-Host "Switchyard.exe SHA256 $h"
      - uses: actions/upload-artifact@v4
        with:
          name: Switchyard-windows
          path: |
            dist/Switchyard.exe
            dist/Switchyard.exe.sha256
  artifact-verification:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - name: Download uploaded Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: Switchyard-windows
          path: candidate
      - name: Verify downloaded candidate checksum and launch
        shell: powershell
        run: |
          $exe = Resolve-Path .\candidate\Switchyard.exe
          $sum = Resolve-Path .\candidate\Switchyard.exe.sha256
          $expected = ((Get-Content $sum) -split '\s+')[0].Trim().ToLower()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Checksum mismatch: expected $expected, got $actual" }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "Candidate executable is unexpectedly small: $($item.Length) bytes" }
          Write-Host "Downloaded candidate verified: $($item.Length) bytes, SHA256 $actual"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Downloaded candidate smoke test failed with exit code $($p.ExitCode)" }
  unix-build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
          - os: ubuntu-22.04
            platform: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build and smoke-test package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller pillow
          python tools/make_icon.py
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m PyInstaller --noconfirm --clean --windowed --name Switchyard --icon assets/icon.ico switchyard_desktop.pyw
            dist/Switchyard.app/Contents/MacOS/Switchyard --smoke-test
            .github/scripts/launch-check.sh dist/Switchyard.app/Contents/MacOS/Switchyard
            ditto -c -k --keepParent dist/Switchyard.app "out/Switchyard-${{ matrix.platform }}.zip"
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name Switchyard switchyard_desktop.pyw
            dist/Switchyard --smoke-test
            .github/scripts/launch-check.sh dist/Switchyard
            tar -C dist -czf "out/Switchyard-${{ matrix.platform }}.tar.gz" Switchyard
          fi
          cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && cat *.sha256

