name: CI
on: [push, pull_request]
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest], python: ['3.10','3.12'] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile switchyard_core.py switchyard_desktop.pyw
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: powershell
        run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: Switchyard-windows, path: dist/Switchyard.exe }
